# Local stack for the API.
# BullMQ workers run inside the API process (see src/server.ts). Redis is the
# lock, so extra API replicas would not double-fetch API-Football.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: futbol
      POSTGRES_PASSWORD: futbol
      POSTGRES_DB: futbol_data
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U futbol -d futbol_data']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://futbol:futbol@postgres:5432/futbol_data
      REDIS_URL: redis://redis:6379
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-your_api_key_here}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  postgres_data:
