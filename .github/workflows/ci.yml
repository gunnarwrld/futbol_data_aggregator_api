name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: futbol
          POSTGRES_PASSWORD: futbol
          POSTGRES_DB: futbol_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futbol -d futbol_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://futbol:futbol@localhost:5432/futbol_data_test
      REDIS_URL: redis://127.0.0.1:6379/1
      API_FOOTBALL_KEY: test_api_key
      API_FOOTBALL_BASE_URL: https://v3.football.api-sports.io
      LOG_LEVEL: error
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Coverage"
              echo
              jq -r '
                "| Metric | Covered | Total | Percent |",
                "| --- | ---: | ---: | ---: |",
                "| Lines | \(.total.lines.covered) | \(.total.lines.total) | \(.total.lines.pct)% |",
                "| Statements | \(.total.statements.covered) | \(.total.statements.total) | \(.total.statements.pct)% |",
                "| Functions | \(.total.functions.covered) | \(.total.functions.total) | \(.total.functions.pct)% |",
                "| Branches | \(.total.branches.covered) | \(.total.branches.total) | \(.total.branches.pct)% |"
              ' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t futbol-data-aggregator-api:ci .
